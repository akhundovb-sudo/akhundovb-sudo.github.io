<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coin Hunter</title>
<meta name="description" content="Coin Hunter: dig up real historical coins at famous landmarks around the world.">
<link rel="icon" href="icon.png">
<style>
  :root { --bg: #120d1f; --ink: #f3ead6; --muted: #b9ab8c; --gold: #ffc02e; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 50% 30%, #2a1f4a, var(--bg) 70%); color: var(--ink); font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; }
  main { max-width: 560px; padding: 40px 16px; }
  img { width: 128px; height: 128px; border-radius: 29px; box-shadow: 0 12px 32px rgba(0,0,0,.45); }
  h1 { margin: 20px 0 8px; font-size: 34px; color: var(--gold); }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); font-size: 14px; }
  a { color: var(--gold); }
  footer { margin-top: 28px; font-size: 14px; }
  footer a { margin: 0 8px; }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="Coin Hunter icon">
  <h1>Coin Hunter</h1>
  <p>Travel the globe, sweep a metal detector over famous historic sites and dig up real coins from museum collections — then clean them and build your collection.</p>
  <p class="muted">Coming soon to the App Store.</p>
  <footer>
    <a href="privacy.html">Privacy Policy</a>·<a href="mailto:akhundovb@gmail.com">Contact</a>
  </footer>
</main>
</body>
</html>
